; Las trazas de error no incluyen los argumentos de cada funcion: sin esto, el
; log podia guardar fragmentos de contraseñas o datos de pacientes que pasaban
; por la pila (auditoria run-1, H12).
zend.exception_ignore_args = On
; No anunciar la version de PHP en la cabecera X-Powered-By.
expose_php = Off
